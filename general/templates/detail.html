<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container">

        <h1>{{ post.title }}</h1>

        <p class="post-id">
            게시글 번호: {{ post.id }}
        </p>

        <div class="post-body">
            {{ post.body }}
        </div>

        <div class="button-group">
            <a class="button" href="/">목록으로</a>

            <a class="button" href="/board/{{ post.id }}/edit">
                수정하기
            </a>

            <a class="button danger" href="/board/{{ post.id }}/delete">
                삭제하기
            </a>
        </div>

    </div>
</body>

</html>
