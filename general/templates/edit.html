<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>게시글 수정</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container">

        <h1>게시글 수정</h1>

        {% if error %}
        <p class="error">
            {{ error }}
        </p>
        {% endif %}

        <form method="post">

            <label for="title">제목</label>

            <input id="title" name="title" type="text" value="{{ title }}">

            <label for="body">내용</label>

            <textarea id="body" name="body" rows="10">{{ body }}</textarea>

            <div class="button-group">
                <button type="submit">
                    수정 저장
                </button>

                <a class="button" href="/board/{{ post.id }}">
                    취소
                </a>
            </div>

        </form>

    </div>
</body>

</html>
