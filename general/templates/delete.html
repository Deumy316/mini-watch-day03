<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>게시글 삭제</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container">

        <h1>게시글 삭제</h1>

        <p>
            <strong>{{ post.title }}</strong>
            글을 정말 삭제하시겠습니까?
        </p>

        <form method="post">

            <div class="button-group">
                <button class="danger" type="submit">
                    삭제 확인
                </button>

                <a class="button" href="/board/{{ post.id }}">
                    취소
                </a>
            </div>

        </form>

    </div>
</body>

</html>
